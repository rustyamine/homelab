services:
  jellyfin:
    image: "jellyfin/jellyfin"
    container_name: jellyfin
    restart: unless-stopped
    network_mode: host
    volumes:
      - "jellyfin_cache:/cache"
      - "jellyfin_config:/config"
      - "/mnt/windows/Fusion/Media:/media"
    devices:
      - "/dev/dri/renderD128:/dev/dri/renderD128:rwm"
volumes:
  jellyfin_cache:
  jellyfin_config:
