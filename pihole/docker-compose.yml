services:
  pihole:
    image: "pihole/pihole:latest"
    container_name: pihole
    restart: unless-stopped
    network_mode: host
    volumes:
      - "pihole_data:/etc/pihole"
    environment:
      - "TZ=Africa/Algiers"
      - "FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}"
volumes:
  pihole_data:
    name: pihole_data
